dependencies {
    implementation project(':mantis-rhino-compat')
    implementation project(':mantis-recipes')
    implementation "org.mozilla:rhino:${findProperty('rhinoVersion') ?: '1.9.1'}"
    implementation 'org.openjdk.jmh:jmh-core:1.37'
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

if (findProperty('rhinoModJar')) {
    sourceSets.main.java.srcDir 'src/reference/java'
    dependencies {
        implementation files(findProperty('rhinoModJar'))
        runtimeOnly 'org.apache.commons:commons-lang3:3.12.0'
    }
}

tasks.register('benchmark', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    doFirst { file('build/results').mkdirs() }
    args '-rf', 'json', '-rff', file('build/results/benchmarks.json').absolutePath, '-foe', 'true'
    if (findProperty('benchmarkArgs')) args findProperty('benchmarkArgs').split(' ').findAll { it }
}

tasks.register('benchmarkSmoke', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    doFirst { file('build/results').mkdirs() }
    args '-f', '0', '-wi', '0', '-i', '1', '-r', '100ms', '-foe', 'true',
            '-rf', 'json', '-rff', file('build/results/smoke.json').absolutePath
}
