name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build Forge mod
        run: ./gradlew test :mantis-minecraft:build --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/reports/tests/'
      - uses: actions/upload-artifact@v4
        with:
          name: mantis-forge-1.20.1
          path: mantis-minecraft/build/libs/mantis-*.jar
