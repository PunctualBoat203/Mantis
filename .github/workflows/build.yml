name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build Forge mod
        run: ./gradlew test :mantis-minecraft:build --stacktrace
      - name: Verify Minecraft recipe and script reloads
        run: |
          ./gradlew :mantis-minecraft:runGameTestServer --stacktrace | tee gametest.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('gametest.log').read_text()
          if not re.search(r'All [1-9][0-9]* required tests passed', log):
              raise SystemExit('Minecraft did not report a completed passing GameTest run')
          PY
      - name: Verify benchmark cases execute
        run: ./gradlew :mantis-benchmarks:benchmarkSmoke --stacktrace
      - name: Verify first-load failure and recovery
        run: |
          ./gradlew :mantis-minecraft:runGameTestServer -PtestFirstLoad --stacktrace | tee gametest-firstload.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('gametest-firstload.log').read_text()
          if 'Intentional first-load test failure' not in log:
              raise SystemExit('The first-load recovery run did not load the deliberately broken script')
          if not re.search(r'All [1-9][0-9]* required tests passed', log):
              raise SystemExit('Minecraft did not report a completed passing first-load recovery test')
          PY
      - name: Verify recipes with Create installed
        run: |
          ./gradlew :mantis-minecraft:runGameTestServer -PtestCreate --stacktrace | tee gametest-create.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('gametest-create.log').read_text()
          if 'Verified installed Create recipes' not in log:
              raise SystemExit('The Create integration checks did not execute')
          if not re.search(r'All [1-9][0-9]* required tests passed', log):
              raise SystemExit('Minecraft did not report passing tests with Create installed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/reports/tests/'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: minecraft-test-logs
          path: mantis-minecraft/run-gametest/logs/
      - uses: actions/upload-artifact@v4
        with:
          name: mantis-forge-1.20.1
          path: mantis-minecraft/build/libs/mantis-*.jar
