buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}

plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
apply plugin: 'org.spongepowered.mixin'

base.archivesName = 'mantis'
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
if (project.hasProperty('testCreate')) {
    repositories {
        maven { url = 'https://maven.createmod.net' }
        maven { url = 'https://maven.ithundxr.dev/mirror' }
        maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    }
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                mantis {
                    source sourceSets.main
                    source project(':mantis-core').sourceSets.main
                    source project(':mantis-interop').sourceSets.main
                    source project(':mantis-runtime').sourceSets.main
                    source project(':mantis-recipes').sourceSets.main
                    source project(':mantis-rhino-compat').sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'mantis'
            if (project.hasProperty('testFirstLoad')) property 'mantis.test.firstload', 'true'
            if (project.hasProperty('testCreate')) property 'mantis.test.create', 'true'
            mods { mantis { source sourceSets.gametest } }
        }
    }
}

mixin {
    add sourceSets.main, 'mantis.refmap.json'
    config 'mantis.mixins.json'
}

jarJar.enable()
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':mantis-runtime')
    implementation project(':mantis-recipes')
    implementation project(':mantis-rhino-compat')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    if (project.hasProperty('testCreate')) {
        runtimeOnly(fg.deobf('com.simibubi.create:create-1.20.1:6.0.8-289:slim')) { transitive = false }
        runtimeOnly fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
        runtimeOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5')
        runtimeOnly fg.deobf('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
        runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    }
    ['org.graalvm.sdk:graal-sdk', 'org.graalvm.js:js', 'org.graalvm.regex:regex', 'org.graalvm.truffle:truffle-api'].each { artifact ->
        minecraftLibrary "${artifact}:${graal_version}"
        jarJar("${artifact}:[${graal_version},23.0.13)") { jarJar.pin(it, graal_version) }
    }
    minecraftLibrary 'com.ibm.icu:icu4j:72.1'
    jarJar('com.ibm.icu:icu4j:[72.1,73)') { jarJar.pin(it, '72.1') }
}

def includedModules = [project(':mantis-core'), project(':mantis-interop'), project(':mantis-runtime'), project(':mantis-recipes'), project(':mantis-rhino-compat')]
tasks.named('processResources').configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.withType(Jar).configureEach {
    manifest.attributes('MixinConfigs': 'mantis.mixins.json', 'Implementation-Version': project.version)
}
['jar', 'jarJar'].each { taskName ->
    tasks.named(taskName).configure { includedModules.each { module -> from(module.sourceSets.main.output) } }
}
tasks.named('sourcesJar').configure { includedModules.each { module -> from(module.sourceSets.main.allSource) } }
reobf { jarJar {} }
tasks.named('jar').configure { archiveClassifier = 'slim'; finalizedBy 'reobfJar' }
tasks.named('jarJar').configure { archiveClassifier = ''; finalizedBy 'reobfJarJar' }
tasks.named('build').configure { dependsOn 'jarJar' }

tasks.register('prepareGameTestScripts', Copy) {
    inputs.property 'testFirstLoad', project.hasProperty('testFirstLoad')
    from 'src/gametest/scripts'
    into 'run-gametest/config/mantis/server_scripts'
    doLast {
        def failure = file('run-gametest/config/mantis/server_scripts/000-initial-failure.js')
        if (project.hasProperty('testFirstLoad')) failure.text = "throw new Error('Intentional first-load test failure');\n"
        else failure.delete()
    }
}
tasks.register('prepareGameTestStartupScripts', Copy) {
    from 'src/gametest/startup_scripts'
    into 'run-gametest/config/mantis/startup_scripts'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn 'prepareGameTestScripts', 'prepareGameTestStartupScripts' }
